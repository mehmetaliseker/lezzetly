# ÖRNEK DOSYA — Bu dosyayı kopyalayıp `application-local.properties` yapabilir
# veya aşağıdaki değişkenleri işletim sistemi / IDE ortam değişkeni olarak tanımlayabilirsiniz.
# Repoya asla gerçek şifre veya API anahtarı yazmayın.

# spring.profiles.active=dev

# PostgreSQL (örnek URL — kendi veritabanınıza göre düzenleyin)
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/lezzetly
# SPRING_DATASOURCE_USERNAME=YOUR_DB_USERNAME
# SPRING_DATASOURCE_PASSWORD=YOUR_DB_PASSWORD

# Geliştirmede şema güncellemesi gerekiyorsa (bilinçli kullanım):
# SPRING_JPA_HIBERNATE_DDL_AUTO=update

# SQL çıktısını yalnızca kısa süreli hata ayıklamada açın:
# SPRING_JPA_SHOW_SQL=true
# SPRING_JPA_FORMAT_SQL=true

# Birden fazla frontend origin (virgülle):
# APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,https://app.example.com

# Sunucu portu:
# SERVER_PORT=8080
