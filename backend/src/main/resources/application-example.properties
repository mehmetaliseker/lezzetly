# ÖRNEK / REHBER — Hassas değerleri asla bu dosyaya veya repoya yazmayın.

# --- Önerilen yerel geliştirme (PowerShell/CMD ortam değişkeni gerekmez) ---
# 1) application-local.example.properties dosyasını kopyalayın:
#    hedef adı: application-local.properties (aynı klasör: src/main/resources/)
# 2) YOUR_* alanlarını kendi PostgreSQL bilgilerinizle doldurun.
# 3) Uygulamayı varsayılan profille çalıştırın (application.properties varsayılanı: local).

# --- Alternatif: ortam değişkeni ile `dev` profili ---
# spring.profiles.active=dev
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/lezzetly_db
# SPRING_DATASOURCE_USERNAME=YOUR_DB_USERNAME
# SPRING_DATASOURCE_PASSWORD=YOUR_DB_PASSWORD

# Şema güncellemesi (yalnızca bilinçli kullanım):
# SPRING_JPA_HIBERNATE_DDL_AUTO=update

# SQL çıktısı (kısa süreli hata ayıklama):
# SPRING_JPA_SHOW_SQL=true
# SPRING_JPA_FORMAT_SQL=true

# Birden fazla frontend origin (virgülle):
# APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,https://app.example.com

# Sunucu portu:
# SERVER_PORT=8080
