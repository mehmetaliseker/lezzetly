spring.application.name=lezzetly-backend

# Yerel: varsayılan `local` + src/main/resources/application-local.properties (gitignore).
# Üretim: SPRING_PROFILES_ACTIVE=prod ve güvenli ortam değişkenleri kullanın.
# Ortam değişkeni ile veritabanı: SPRING_PROFILES_ACTIVE=dev ve SPRING_DATASOURCE_* tanımlayın.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
