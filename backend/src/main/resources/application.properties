spring.application.name=lezzetly-backend

server.port=${SERVER_PORT:8080}

# Ortam: dev | prod | test (test sınıfları src/test/resources ile ezilir)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Veritabanı: sırlar yalnızca ortam değişkeni veya yerel (git dışı) dosyadan gelmelidir.
# Aşağıdaki üç değer repoda varsayılan olarak tanımlanmaz; örnek için application-example.properties dosyasına bakın.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Güvenli varsayılan: production benzeri davranış. Geliştirmede ihtiyaç halinde env ile açın.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Virgülle ayrılmış origin listesi; production'da gerçek frontend origin'lerini env ile verin.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
